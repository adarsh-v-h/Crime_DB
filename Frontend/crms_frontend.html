    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion || window.FramerMotion || window.framerMotion || window['framer-motion'] || {};

        // ─── API CONFIG ───────────────────────────────────────────────────────
        // For separate frontend/backend deploys, set window.CRMS_API_BASE or visit once with ?api_base=https://your-backend.onrender.com
        const queryApiBase = new URLSearchParams(window.location.search).get("api_base");
        if (queryApiBase) localStorage.setItem("CRMS_API_BASE", queryApiBase);
        const configuredApiBase = window.CRMS_API_BASE || localStorage.getItem("CRMS_API_BASE") || "";
        const API_BASE = (
            configuredApiBase ||
            (window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("file:")
                ? window.location.origin
                : "http://localhost:5000")
        ).replace(/\/$/, "");
        const OFFICER_STORAGE_KEY = "CRMS_OFFICER_SESSION";

        const getStoredOfficer = () => {
            try {
                return JSON.parse(localStorage.getItem(OFFICER_STORAGE_KEY) || "null");
            } catch {
                return null;
            }
        };

        const getStoredSessionToken = () => getStoredOfficer()?.session_token || "";
        const storeOfficerSession = (officerData) => localStorage.setItem(OFFICER_STORAGE_KEY, JSON.stringify(officerData));
        const clearOfficerSession = () => localStorage.removeItem(OFFICER_STORAGE_KEY);
        const PUBLIC_COMPLAINT_DRAFT_KEY = "CRMS_PUBLIC_COMPLAINT_DRAFT";

        const getPublicComplaintDraft = () => {
            try {
                return JSON.parse(localStorage.getItem(PUBLIC_COMPLAINT_DRAFT_KEY) || "null");
            } catch {
                return null;
            }
        };

        const clearPublicComplaintDraft = () => localStorage.removeItem(PUBLIC_COMPLAINT_DRAFT_KEY);
        const authHeaders = (officer) => ({
            "X-Officer-Id": officer?.officer_id?.toString(),
            "X-Session-Token": officer?.session_token || getStoredSessionToken()
        });
        
        // reCAPTCHA v2 (Invisible) Configuration
        const RECAPTCHA_PUBLIC_KEY = window._recaptcha_site_key || "6LfLCfIsAAAAAK4ZwH_RMmvAPAi3vtkGKPLAYkuk";

        // Generic fetch helper — returns parsed JSON or throws with a readable message.
        const apiFetch = async (path, options = {}) => {
            const { headers, ...rest } = options;
            const sessionToken = getStoredSessionToken();
            const res = await fetch(`${API_BASE}${path}`, {
                headers: { 
                    "Content-Type": "application/json",
                    ...(sessionToken ? { "X-Session-Token": sessionToken } : {}),
                    ...(headers || {})
                },
                ...rest,
            });
            const json = await res.json();
            if (!res.ok && res.status === 401 && String(json.error || "").toLowerCase().includes("session")) {
                clearOfficerSession();
            }
            if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
            return json;
        };
        
        // Execute reCAPTCHA v2 and return token
        const executeRecaptcha = async (action = "submit") => {
            const siteKey = window._recaptcha_site_key || RECAPTCHA_PUBLIC_KEY;
            console.log("[reCAPTCHA] Executing reCAPTCHA v2 for action:", action);

            // Wait for grecaptcha to load
            const waitForGrecaptcha = () => new Promise(resolve => {
                if (window.grecaptcha?.render) {
                    return resolve();
                }
                let waited = 0;
                const iv = setInterval(() => {
                    if (window.grecaptcha?.render) {
                        clearInterval(iv);
                        resolve();
                    } else if (waited > 10000) {
                        console.error("[reCAPTCHA] Script failed to load");
                        clearInterval(iv);
                        resolve();
                    }
                    waited += 100;
                }, 100);
            });

            try {
                await waitForGrecaptcha();
                
                if (!window.grecaptcha?.render) {
                    console.error("[reCAPTCHA] grecaptcha.render unavailable");
                    return "";
                }

                return new Promise((resolve) => {
                    // Create modal for CAPTCHA challenge UI (rendered if verification is required)
                    const overlay = document.createElement('div');
                    overlay.style.cssText = `
                        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                        background: rgba(0,0,0,0.65); z-index: 9998;
                        display: flex; align-items: center; justify-content: center;
                        backdrop-filter: blur(3px);
                    `;
                    
                    const container = document.createElement('div');
                    container.style.cssText = `
                        background: #111827; padding: 30px; border-radius: 12px;
                        border: 1px solid #374151; text-align: center;
                        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
                    `;
                    
                    const title = document.createElement('p');
                    title.textContent = "Verifying Security Credentials";
                    title.style.cssText = 'margin-bottom: 20px; font-weight: 500; color: #f3f4f6; font-size: 15px; font-family: monospace;';
                    
                    const captchaDiv = document.createElement('div');
                    captchaDiv.id = `g-recaptcha-${Date.now()}`;
                    
                    container.appendChild(title);
                    container.appendChild(captchaDiv);
                    overlay.appendChild(container);
                    document.body.appendChild(overlay);
                    
                    // Track completion
                    let completed = false;
                    const timeoutId = setTimeout(() => {
                        if (!completed) {
                            console.warn("[reCAPTCHA] Timeout (2 min)");
                            overlay.remove();
                            resolve("");
                        }
                    }, 120000);
                    
                    // Callback
                    const callbackName = `onRecaptchaSuccess_${Date.now()}`;
                    window[callbackName] = (token) => {
                        if (completed) return;
                        completed = true;
                        clearTimeout(timeoutId);
                        console.log("[reCAPTCHA] Token received");
                        overlay.remove();
                        try { delete window[callbackName]; } catch(e) {}
                        resolve(token);
                    };
                    
                    try {
                        // 1. Render the reCAPTCHA instance configured explicitly as 'invisible'
                        const widgetId = grecaptcha.render(captchaDiv.id, {
                            sitekey: siteKey,
                            size: 'invisible',
                            callback: callbackName,
                            'error-callback': () => {
                                if (completed) return;
                                completed = true;
                                clearTimeout(timeoutId);
                                console.error("[reCAPTCHA] Execution error encountered");
                                overlay.remove();
                                resolve("");
                            },
                            'expired-callback': () => {
                                console.warn("[reCAPTCHA] Token expired");
                            }
                        });

                        // 2. Explicitly fire the execution challenge programmatically
                        grecaptcha.execute(widgetId);

                    } catch (err) {
                        clearTimeout(timeoutId);
                        console.error("[reCAPTCHA] Render error:", err);
                        overlay.remove();
                        resolve("");
                    }
                });
            } catch (err) {
                console.error("[reCAPTCHA] Error:", err);
                return "";
            }
        };

            const [display, setDisplay] = useState(0);
            const ref = useRef(null);
            const [hasAnimated, setHasAnimated] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting && !hasAnimated) {
                            setHasAnimated(true);
                            const startTime = Date.now();
                            const animate = () => {
                                const elapsed = Date.now() - startTime;
                                const progress = Math.min(elapsed / duration, 1);
                                const eased = 1 - Math.pow(1 - progress, 3);
                                setDisplay(Math.floor(eased * value));
                                if (progress < 1) requestAnimationFrame(animate);
                            };
                            requestAnimationFrame(animate);
                        }
                    },
                    { threshold: 0.3 }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [value, duration, hasAnimated]);

            return (
                <span ref={ref} className="metric-value">{prefix}{display.toLocaleString()}{suffix}</span>
            );

        // ─── PUBLIC PORTAL ────────────────────────────────────────────────────
        const PublicPortal = ({ onNavigate }) => {
            const savedComplaintDraft = getPublicComplaintDraft();
            const [activeTab, setActiveTab] = useState("complaint");
            const [error, setError] = useState("");
            const [formData, setFormData] = useState({
                name: savedComplaintDraft?.formData?.name || "",
                contact: savedComplaintDraft?.formData?.contact || "",
                email: savedComplaintDraft?.formData?.email || "",
                aadhaar: savedComplaintDraft?.formData?.aadhaar || "",
                incident_desc: savedComplaintDraft?.formData?.incident_desc || "",
                crime_type: savedComplaintDraft?.formData?.crime_type || "",
                location: savedComplaintDraft?.formData?.location || ""
            });
            const [aadhaarError, setAadhaarError] = useState("");
            const [submitted, setSubmitted] = useState(false);
            const [accessForm, setAccessForm] = useState({ case_id: "", requester_name: "", requester_email: "", requester_number: "", reason: "" });

            const [accessSubmitted, setAccessSubmitted] = useState(false);

            const [submitting, setSubmitting] = useState(false);
            const [caseRef, setCaseRef] = useState(null);

            // Browse Cases state
            const [browsingCases, setBrowsingCases] = useState([]);
            const [browseCaseFilters, setBrowseCaseFilters] = useState({ status: "Active", crime_type: "", location: "", search: "" });
            const [browseCaseLoading, setBrowseCaseLoading] = useState(false);

            // Safety and Verification states
            const [showDisclaimer, setShowDisclaimer] = useState(false);
            const [emailValidating, setEmailValidating] = useState(false);
            const [emailValid, setEmailValid] = useState(null); // null | true | false
            const [otpSent, setOtpSent] = useState(savedComplaintDraft?.verifyStep === "otp");
            const [otpValue, setOtpValue] = useState("");
            const [otpVerified, setOtpVerified] = useState(false);
            const [verificationToken, setVerificationToken] = useState(null);
            const [otpCountdown, setOtpCountdown] = useState(() => {
                if (savedComplaintDraft?.verifyStep !== "otp") return 0;
                return Math.max(0, Math.ceil(((savedComplaintDraft.otpExpiresAt || 0) - Date.now()) / 1000));
            });
            const [verifyStep, setVerifyStep] = useState(() => {
                if (savedComplaintDraft?.verifyStep === "otp" && otpCountdown > 0) return "otp";
                return "form";
            }); // "form"|"disclaimer"|"email"|"otp"|"ready"
            const [otpExpiresAt, setOtpExpiresAt] = useState(savedComplaintDraft?.otpExpiresAt || null);

            useEffect(() => {
                const hasDraftData = Object.values(formData).some(value => String(value || "").trim());
                if (!hasDraftData && verifyStep === "form") {
                    clearPublicComplaintDraft();
                    return;
                }

                if (hasDraftData || verifyStep === "otp") {
                    localStorage.setItem(PUBLIC_COMPLAINT_DRAFT_KEY, JSON.stringify({
                        formData,
                        verifyStep: verifyStep === "otp" ? "otp" : "form",
                        otpExpiresAt: verifyStep === "otp" ? otpExpiresAt : null,
                        savedAt: Date.now()
                    }));
                }
            }, [formData, verifyStep, otpExpiresAt]);

            // OTP Countdown Timer Effect
            useEffect(() => {
                if (verifyStep !== "otp" || !otpExpiresAt) return;

                const syncCountdown = () => {
                    setOtpCountdown(Math.max(0, Math.ceil((otpExpiresAt - Date.now()) / 1000)));
                };

                syncCountdown();
                const timer = setInterval(syncCountdown, 1000);
                return () => clearInterval(timer);
            }, [verifyStep, otpExpiresAt]);

            const handleFormSubmitAttempt = (e) => {
                e.preventDefault();
                // Validate Aadhaar 12-digit number
                const a12 = formData.aadhaar.trim();
                if (!/^[0-9]{12}$/.test(a12)) {
                    setAadhaarError("Enter exactly 12 digits for Aadhaar number");
                    return;
                }
                setAadhaarError("");
                setError("");
                
                // Show Disclaimer Modal
                setShowDisclaimer(true);
                setVerifyStep("disclaimer");
            };

            const handleDisclaimerReject = () => {
                setShowDisclaimer(false);
                setVerifyStep("form");
            };

            const handleDisclaimerAccept = async () => {
                setShowDisclaimer(false);
                
                setVerifyStep("email");
                setEmailValidating(true);
                try {
                    const res = await apiFetch("/public/verify-email", {
                        method: "POST",
                        body: JSON.stringify({ email: formData.email.trim() })
                    });
                    if (res.success && res.valid) {
                        setEmailValid(true);
                        await startOtpFlow();
                    } else {
                        setEmailValid(false);
                        setError(res.reason || "Invalid email domain. Please check your email address.");
                        setVerifyStep("form");
                    }
                } catch (err) {
                    setEmailValid(false);
                    setError("Email verification failed: " + err.message);
                    setVerifyStep("form");
                } finally {
                    setEmailValidating(false);
                }
            };

            const startOtpFlow = async () => {
                setVerifyStep("otp");
                setOtpSent(false);
                setOtpValue("");
                setOtpVerified(false);
                setOtpCountdown(120);
                setOtpExpiresAt(Date.now() + 120000);
                setError("");
                
                try {
                    const res = await apiFetch("/public/otp/send", {
                        method: "POST",
                        body: JSON.stringify({ email: formData.email.trim() })
                    });
                    if (res.success) {
                        setOtpSent(true);
                    } else {
                        setError(res.message || "Failed to send OTP.");
                        setVerifyStep("form");
                    }
                } catch (err) {
                    setError("Failed to send OTP: " + err.message);
                    setVerifyStep("form");
                }
            };

            const handleResendOtp = async () => {
                if (otpCountdown > 90) return; // Wait 30 seconds
                setOtpCountdown(120);
                setOtpExpiresAt(Date.now() + 120000);
                setError("");
                try {
                    const res = await apiFetch("/public/otp/send", {
                        method: "POST",
                        body: JSON.stringify({ email: formData.email.trim() })
                    });
                    if (res.success) {
                        alert("OTP resent successfully.");
                    } else {
                        setError(res.message || "Failed to resend OTP.");
                    }
                } catch (err) {
                    setError("Failed to resend OTP: " + err.message);
                }
            };

            const handleVerifyOtp = async () => {
                if (!otpValue || otpValue.length !== 6) {
                    alert("Please enter a valid 6-digit OTP.");
                    return;
                }
                setError("");
                try {
                    const res = await apiFetch("/public/otp/verify", {
                        method: "POST",
                        body: JSON.stringify({ email: formData.email.trim(), otp: otpValue })
                    });
                    if (res.success && res.verified) {
                        setOtpVerified(true);
                        setVerificationToken(res.token);
                        setVerifyStep("ready");
                        await finalizeComplaintSubmission(res.token);
                    } else {
                        setError(res.message || "OTP verification failed.");
                    }
                } catch (err) {
                    setError("OTP verification failed: " + err.message);
                }
            };

            const finalizeComplaintSubmission = async (token) => {
                setSubmitting(true);
                setError("");
                try {
                    const captchaToken = await executeRecaptcha("complaint");
                    if (!captchaToken) {
                        setError("CAPTCHA verification is required");
                        setVerifyStep("form");
                        return;
                    }
                    const payload = {
                        ...formData,
                        aadhaar: formData.aadhaar.trim(),
                        complaint_mode: "Online",
                        captcha_token: captchaToken,
                        email_verification_token: token
                    };
                    const res = await apiFetch("/public/complaint", {
                        method: "POST",
                        body: JSON.stringify(payload),
                    });
                    setCaseRef(res.reference || null);
                    setSubmitted(true);
                    clearPublicComplaintDraft();
                    setFormData({
                        name: "", contact: "", email: "", aadhaar: "",
                        incident_desc: "", crime_type: "", location: ""
                    });
                    setVerifyStep("form");
                } catch (err) {
                    setError("Submission failed: " + err.message);
                    setVerifyStep("form");
                } finally {
                    setSubmitting(false);
                }
                setTimeout(() => { setSubmitted(false); setCaseRef(null); }, 8000);
            };


            const handleAccessSubmit = async (e) => {
                e.preventDefault();
                setError("");
                setSubmitting(true);
                try {
                    // Get CAPTCHA token
                    const captchaToken = await executeRecaptcha("access_request");
                    if (!captchaToken) {
                        setError("CAPTCHA verification is required for access requests");
                        setSubmitting(false);
                        return;
                    }
                    const payload = { ...accessForm, captcha_token: captchaToken };
                    await apiFetch("/public/access-request", {
                        method: "POST",
                        body: JSON.stringify(payload),
                    });
                    setAccessSubmitted(true);
                    setAccessForm({ case_id: "", requester_name: "", requester_email: "", requester_number: "", reason: "" });
                } catch (err) {
                    console.warn("[Themis's Domain] Access request POST failed:", err.message);
                    setError(err.message || "Failed to submit access request.");
                } finally {
                    setSubmitting(false);
                }
                setTimeout(() => setAccessSubmitted(false), 8000);
            };

            // Load cases when browse tab is selected
            useEffect(() => {
                if (activeTab === "browse") {
                    loadBrowsingCases();
                }
            }, [activeTab]);

            const loadBrowsingCases = async () => {
                setBrowseCaseLoading(true);
                try {
                    const params = new URLSearchParams();
                    if (browseCaseFilters.status) params.append("status", browseCaseFilters.status);
                    if (browseCaseFilters.crime_type) params.append("crime_type", browseCaseFilters.crime_type);
                    if (browseCaseFilters.location) params.append("location", browseCaseFilters.location);
                    if (browseCaseFilters.search) params.append("search", browseCaseFilters.search);

                    const res = await apiFetch(`/public/cases?${params.toString()}`, { method: "GET" });
                    setBrowsingCases(res.data || []);
                } catch (err) {
                    console.warn("[Themis's Domain] Failed to load cases:", err.message);
                    setBrowsingCases([]);
                } finally {
                    setBrowseCaseLoading(false);
                }
            };

            const handleBrowseCaseFilterChange = (field, value) => {
                const updated = { ...browseCaseFilters, [field]: value };
                setBrowseCaseFilters(updated);
                // Trigger immediate filter update
                setBrowsingCases([]); // Clear loading state
                setTimeout(() => {
                    const params = new URLSearchParams();
                    if (updated.status) params.append("status", updated.status);
                    if (updated.crime_type) params.append("crime_type", updated.crime_type);
                    if (updated.location) params.append("location", updated.location);
                    if (updated.search) params.append("search", updated.search);

                    apiFetch(`/public/cases?${params.toString()}`, { method: "GET" })
                        .then(res => setBrowsingCases(res.data || []))
                        .catch(err => { console.warn(err.message); setBrowsingCases([]); });
                }, 300);
            };

            const handleSelectCaseForAccess = (caseId, caseDisplayId) => {
                setAccessForm({ ...accessForm, case_id: caseDisplayId });
                setActiveTab("access");
                setError("");
            };


            return (
                <CrmsPageShell
                    title="Themis's Domain Public Portal"
                    subtitle="Bengaluru Police Department"
                    onBack={() => onNavigate("landing")}
                    scrim="bg-white/40"
                >
                    <motion.div
                        className="mx-auto max-w-4xl px-5 py-10 sm:px-8 sm:py-12"
                        initial="hidden"
                        animate="visible"
                        variants={{ hidden: {}, visible: { transition: { staggerChildren: 0.08 } } }}
                    >
                        <motion.div variants={fadeUp} custom={0} className="mb-10 text-center sm:mb-12">
                            <h1 className="mb-3 text-2xl font-semibold uppercase tracking-[0.12em] text-black sm:text-3xl md:text-4xl">Public Services</h1>
                            <p className="text-xs font-semibold uppercase tracking-[0.14em] text-black/70 sm:text-sm">File complaints and request case information securely</p>
                        </motion.div>

                        {/* Tabs */}
                        <motion.div variants={fadeUp} custom={1} className="mb-10 flex justify-center px-4">
                            <div className="flex flex-col sm:flex-row gap-1 rounded-2xl sm:rounded-full border-2 border-black bg-white/80 p-1 backdrop-blur-sm w-full sm:w-auto">
                                <button
                                    type="button"
                                    onClick={() => setActiveTab("complaint")}
                                    className={`rounded-xl sm:rounded-full w-full sm:w-auto px-5 py-2.5 text-[10px] font-semibold uppercase tracking-[0.14em] transition-all sm:px-6 sm:text-xs ${activeTab === "complaint" ? "bg-black text-white" : "text-black/60 hover:text-black"}`}
                                >
                                    <span className="flex items-center justify-center gap-2">
                                        <Icon name="FilePlus" size={14} />
                                        File Complaint
                                    </span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setActiveTab("browse")}
                                    className={`rounded-xl sm:rounded-full w-full sm:w-auto px-5 py-2.5 text-[10px] font-semibold uppercase tracking-[0.14em] transition-all sm:px-6 sm:text-xs ${activeTab === "browse" ? "bg-black text-white" : "text-black/60 hover:text-black"}`}
                                >
                                    <span className="flex items-center justify-center gap-2">
                                        <Icon name="Search" size={14} />
                                        Browse Cases
                                    </span>
                                </button>
                                <button
                                    type="button"
                                    onClick={() => setActiveTab("access")}
                                    className={`rounded-xl sm:rounded-full w-full sm:w-auto px-5 py-2.5 text-[10px] font-semibold uppercase tracking-[0.14em] transition-all sm:px-6 sm:text-xs ${activeTab === "access" ? "bg-black text-white" : "text-black/60 hover:text-black"}`}
                                >
                                    <span className="flex items-center justify-center gap-2">
                                        <Icon name="Eye" size={14} />
                                        Request Case Access
                                    </span>
                                </button>
                            </div>
                        </motion.div>

                        {/* Complaint Form */}
                        {activeTab === "complaint" && (
                            <motion.div variants={fadeUp} custom={2} className={ThemisNomos_CARD}>
                                <div className="mb-8 flex items-center gap-3">
                                    <div className="flex h-10 w-10 items-center justify-center rounded-full border-2 border-black bg-white">
                                        <Icon name="FileText" size={18} className="text-black" />
                                    </div>
                                    <div>
                                        <h2 className="text-lg font-semibold uppercase tracking-[0.1em] text-black sm:text-xl">File a Complaint</h2>
                                        <p className="text-[10px] font-semibold uppercase tracking-[0.14em] text-black/65 sm:text-xs">Submit a new case to the Bengaluru Police</p>
                                    </div>
                                </div>

                                {submitted ? (
                                    <div className="py-12 text-center">
                                        <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full border-2 border-black bg-white">
                                            <Icon name="CheckCircle" size={28} className="text-accent" />
                                        </div>
                                        <h3 className="mb-2 text-lg font-semibold uppercase tracking-[0.1em] text-black">Complaint Submitted</h3>
                                        {caseRef && (
                                            <div className="mb-4 inline-flex items-center gap-2 rounded-full border-2 border-black bg-white/80 px-4 py-2">
                                                <span className="text-[10px] font-semibold uppercase tracking-[0.16em] text-black/60">Your Reference</span>
                                                <span className="font-mono text-lg font-bold text-accent">{caseRef}</span>
                                            </div>
                                        )}
                                        <p className="text-xs font-semibold uppercase tracking-[0.1em] text-black/70">Complaint logged for officer review. Save your reference number — you will need it to track your case.</p>

        // ─── STAFF DASHBOARD ──────────────────────────────────────────────────
        const StaffDashboard = ({ onNavigate, userRole, officer, onLogout }) => {
            // Filter States
            const [statusFilter, setStatusFilter] = useState("All");
            const [typeFilter, setTypeFilter] = useState("All");
            const [searchQuery, setSearchQuery] = useState("");
            
            // Core Data & Pagination States
            const [cases, setCases] = useState([]);
            const [currentPage, setCurrentPage] = useState(1);
            const [totalPages, setTotalPages] = useState(1);
            const [totalRecords, setTotalRecords] = useState(0);
            const [caseRefreshTick, setCaseRefreshTick] = useState(0);
            
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [selectedCase, setSelectedCase] = useState(null);
            const [dossierLoading, setDossierLoading] = useState(false);
            const [dossierMessage, setDossierMessage] = useState(null);
            const [dossierError, setDossierError] = useState(null);
            const [modalTab, setModalTab] = useState("details");
            const [timelineUpdates, setTimelineUpdates] = useState([]);
            const [evidenceItems, setEvidenceItems] = useState([]);
            const [newUpdateText, setNewUpdateText] = useState("");
            const [evidenceFile, setEvidenceFile] = useState(null);
            const [evidenceDesc, setEvidenceDesc] = useState("");

            // Tab State
            const [activeSubTab, setActiveSubTab] = useState("dossiers");
            
            // Access Requests States
            const [requests, setRequests] = useState([]);
            const [requestsLoading, setRequestsLoading] = useState(false);
            const [requestsError, setRequestsError] = useState(null);
            const [decidingRequestId, setDecidingRequestId] = useState(null);
            const [requestActionMessage, setRequestActionMessage] = useState(null);

            // Authorization state for access requests
            const [accessRequestAuthStatus, setAccessRequestAuthStatus] = useState({});

            // Helper: Check if officer is admin
            const isAdmin = () => (officer?.role || "").toLowerCase() === "admin";

            // Helper: Check if officer can approve/reject access requests for a case
            const canDecideAccessRequest = async (caseId) => {
                // Admins can always decide
                if (isAdmin()) return true;
                // Fetch assigned officers and determine highest-ranked officer
                try {
                    const res = await apiFetch(`/cases/${caseId}/officers`, {
                        headers: { "X-Officer-Id": officer?.officer_id?.toString() }
                    });
                    if (res.success) {
                        const officersList = res.data?.officers || [];
                        if (!officersList.length) return false;

                        const rankValue = (r) => {
                            switch ((r || "").toLowerCase()) {
                                case "inspector": return 4;
                                case "sub-inspector": return 3;
                                case "head constable": return 2;
                                case "constable": return 1;
                                default: return 0;
                            }
                        };

                        let highest = officersList[0];
                        for (const o of officersList) {
                            if (rankValue(o.rank) > rankValue(highest.rank)) highest = o;
                        }

                        return officer?.officer_id && highest && officer.officer_id === highest.officer_id;
                    }
                } catch (err) {
                    console.error("Error checking access request authorization:", err);
                }
                return false;
            };

            const loadAccessRequests = async () => {
                setRequestsLoading(true);
                setRequestsError(null);
                try {
                    const response = await apiFetch("/api/access-requests", {
                        headers: {
                            "X-Officer-Id": officer?.officer_id?.toString()
                        }
                    });
                    if (response.success) {
                        setRequests(response.data || []);
                        // Check authorization for each request's case
                        const authStatus = {};
                        for (const req of (response.data || [])) {
                            authStatus[req.case_id] = await canDecideAccessRequest(req.case_id);
                        }
                        setAccessRequestAuthStatus(authStatus);
                    } else {
                        setRequestsError(response.error || "Failed to load access requests.");
                    }
                } catch (err) {
                    console.error("[Themis's Domain Engine] Requests load error:", err);
                    setRequestsError(err.message || "Failed to contact authorization server.");
                } finally {
                    setRequestsLoading(false);
                }
            };

            useEffect(() => {
                if (officer) {
                    loadAccessRequests();
                }
            }, [activeSubTab, officer]);

            const handleDecide = async (requestId, action) => {
                setDecidingRequestId(requestId);
                setRequestActionMessage(null);
                try {
                    const response = await apiFetch(`/api/access-requests/${requestId}/${action}`, {
                        method: "POST",
                        headers: {
                            "X-Officer-Id": officer?.officer_id?.toString()
                        }
                    });
                    if (response.success) {
                        setRequestActionMessage(response.message || `Request ${action === "approve" ? "approved" : "declined"}.`);
                        await loadAccessRequests();
                    } else {
                        setRequestsError(response.error || "Action failed.");
                    }
                } catch (err) {
                    setRequestsError(err.message || "Action failed.");
                } finally {
                    setDecidingRequestId(null);
                }
            };

            const requestStatusBadge = (status) => {
                const styles = {
                    Pending: "bg-amber-100 text-amber-900 border-amber-400",
                    Accepted: "bg-emerald-100 text-emerald-900 border-emerald-500",
                    Rejected: "bg-rose-100 text-rose-900 border-rose-400",
                };
                return (
                    <span className={`rounded-full border-2 px-3 py-1 text-[10px] font-semibold uppercase tracking-[0.12em] ${styles[status] || styles.Pending}`}>
                        {status}
                    </span>
                );
            };
            
            const pendingCount = requests.filter(r => r.status === "Pending").length;


            // Fetch live data from backend whenever filters or page changes
            useEffect(() => {
                const loadCases = async () => {
                    setLoading(true);
                    setError(null);
                    try {
                        let queryParams = new URLSearchParams({
                            page: currentPage,
                            limit: 16
                        });
                        
                        if (statusFilter !== "All") queryParams.append("status", statusFilter);
                        if (typeFilter !== "All") queryParams.append("crime_type", typeFilter);
                        if (searchQuery.trim() !== "") queryParams.append("search", searchQuery.trim());

                        const response = await apiFetch(`/api/cases?${queryParams.toString()}`, {
                            headers: {
                                "X-Officer-Id": officer?.officer_id?.toString()
                            }
                        });
                        if (response.success) {
                            setCases(response.data || []);
                            if (response.pagination) {
                                setTotalPages(response.pagination.total_pages || 1);
                                setTotalRecords(response.pagination.total_records || 0);
                            }
                        } else {
                            setError(response.error || "Failed to sync system records.");
                        }
                    } catch (err) {
                        console.error("[Themis's Domain Engine] Sync error:", err);
                        setError(err.message || "Network isolation protocol failure.");
                    } finally {
                        setLoading(false);
                    }
                };

                loadCases();
            }, [statusFilter, typeFilter, searchQuery, currentPage, caseRefreshTick]);

            useEffect(() => {
                if (!officer) return;
                const refreshCases = () => setCaseRefreshTick(tick => tick + 1);
                const refreshVisibleCases = () => {
                    if (!document.hidden) refreshCases();
                };
                const intervalId = setInterval(refreshCases, 45000);
                window.addEventListener("focus", refreshCases);
                document.addEventListener("visibilitychange", refreshVisibleCases);
                return () => {
                    clearInterval(intervalId);
                    window.removeEventListener("focus", refreshCases);
                    document.removeEventListener("visibilitychange", refreshVisibleCases);
                };
            }, [officer]);

            // Reset back to page 1 if search or status filters change
            const handleFilterChange = (type, val) => {
                setCurrentPage(1);
                if (type === "status") setStatusFilter(val);
                if (type === "type") setTypeFilter(val);
            };

            // Handle case status update
            const handleCaseStatusUpdate = async (caseId, newStatus) => {
                try {
                    const response = await apiFetch(`/cases/${caseId}`, {
                        method: "PATCH",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Officer-Id": officer?.officer_id?.toString()
                        },
                        body: JSON.stringify({ status: newStatus })
                    });

                    if (response.success) {
                        // Update the selected case in the modal
                        setSelectedCase(prev => ({
                            ...prev,
                            status: newStatus
                        }));
                        
                        // Reload cases to reflect the change
                        setCurrentPage(1);
                        setStatusFilter("All");
                        setTypeFilter("All");
                        setSearchQuery("");
                        
                        // Show success message
                        console.log(`[CASE UPDATE] Case ${caseId} status updated to ${newStatus}`);
                    } else {
                        setError(response.error || "Failed to update case status");
                        console.error("[CASE UPDATE] Error:", response.error);
                    }
                } catch (err) {
                    setError(`Failed to update case status: ${err.message}`);
                    console.error("[CASE UPDATE] Network error:", err);
                }
            };

            // Handle updated dossier request
            const handleRequestDossier = async (caseId) => {
                setDossierLoading(true);
                setDossierMessage(null);
                setDossierError(null);
                try {
                    const response = await apiFetch(`/cases/${caseId}/request-dossier`, {
                        method: "POST",
                        headers: {
                            "X-Officer-Id": officer?.officer_id?.toString()
                        }
                    });
                    if (response.success) {
                        setDossierMessage(response.message || "Updated case dossier has been requested and will be emailed to you shortly.");
                        setTimeout(() => setDossierMessage(null), 5000);
                    } else {
                        setDossierError(response.error || "Failed to request updated dossier");
                        setTimeout(() => setDossierError(null), 5000);
                    }
                } catch (err) {
                    setDossierError(err.message || "Failed to request updated dossier");
                    setTimeout(() => setDossierError(null), 5000);
                } finally {
                    setDossierLoading(false);
                }
            };

            // Fetch case timeline updates
            const loadCaseTimeline = async (caseId) => {
                try {
                    const res = await apiFetch(`/cases/${caseId}/updates`, {
                        headers: { "X-Officer-Id": officer?.officer_id?.toString() }
                    });
                    if (res.success) {
                        setTimelineUpdates(res.data || []);
                    }
                } catch (err) {
                    console.error("Failed to load timeline updates:", err.message);
                }
            };

            // Fetch case evidence
            const loadCaseEvidence = async (caseId) => {
                try {
                    const res = await apiFetch(`/cases/${caseId}/evidence`, {
                        headers: { "X-Officer-Id": officer?.officer_id?.toString() }
                    });
                    if (res.success) {
                        setEvidenceItems(res.data || []);
                    }
                } catch (err) {
                    console.error("Failed to load evidence:", err.message);
                }
            };

            // Add timeline update
            const handleAddTimelineUpdate = async (caseId) => {
                if (!newUpdateText.trim()) return;
                setDossierLoading(true); // Reuse loading spinners safely
                setActionError(null);
                try {
                    const res = await apiFetch(`/cases/${caseId}/updates`, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "X-Officer-Id": officer?.officer_id?.toString() 
                        },
                        body: JSON.stringify({ update_text: newUpdateText })
                    });
                    if (res.success) {
                        setNewUpdateText("");
                        await loadCaseTimeline(caseId);
                    } else {
                        setActionError(res.error || "Failed to add timeline update");
                    }
                } catch (err) {
                    setActionError(err.message);
                } finally {
                    setDossierLoading(false);
                }
            };

            // Upload evidence file
            const handleUploadEvidence = async (caseId) => {
                if (!evidenceFile) return;
                setDossierLoading(true);
                setActionError(null);
                try {
                    const formData = new FormData();
                    formData.append("file", evidenceFile);
                    if (evidenceDesc.trim()) {
                        formData.append("description", evidenceDesc);
                    }

                    const response = await fetch(`${API_BASE}/cases/${caseId}/evidence`, {
                        method: "POST",
                        headers: {
                            ...authHeaders(officer)
                        },
                        body: formData
                    });
                    const res = await response.json();
                    if (!response.ok && response.status === 401 && String(res.error || "").toLowerCase().includes("session")) {
                        clearOfficerSession();
                    }
                    if (response.ok && res.success) {
                        setEvidenceFile(null);
                        setEvidenceDesc("");
                        const fileInput = document.getElementById("evidence-file-input");
                        if (fileInput) fileInput.value = "";
                        await loadCaseEvidence(caseId);
                    } else {
                        setActionError(res.error || "Upload failed");
                    }
                } catch (err) {
                    setActionError(err.message);
                } finally {
                    setDossierLoading(false);
                }
            };

            // Delete evidence
            const handleDeleteEvidence = async (caseId, evidenceId) => {
                if (!confirm("Are you sure you want to permanently delete this evidence item? This will also remove the physical file from the server.")) return;
                setDossierLoading(true);
                setActionError(null);
                try {
                    const res = await apiFetch(`/cases/evidence/${evidenceId}`, {
                        method: "DELETE",
                        headers: {
                            "X-Officer-Id": officer?.officer_id?.toString()
                        }
                    });
                    if (res.success) {
                        await loadCaseEvidence(caseId);
                    } else {
                        setActionError(res.error || "Failed to delete evidence");
                    }
                } catch (err) {
                    setActionError(err.message);
                } finally {
                    setDossierLoading(false);
                }
            };

            const [actionError, setActionError] = useState(null);

            useEffect(() => {
                if (selectedCase) {
                    if (modalTab === "timeline") {
                        loadCaseTimeline(selectedCase.case_id);
                    } else if (modalTab === "evidence") {
                        loadCaseEvidence(selectedCase.case_id);
                    }
                } else {
                    setModalTab("details");
                }
            }, [selectedCase, modalTab]);

            return (
                <CrmsPageShell
                    title="Bengaluru Police · Intralink"
                    subtitle="Officer Command Dashboard"
                    onBack={() => onNavigate("landing")}
                    scrim="bg-white/42"
                >

                            <div className="text-[10px] font-semibold uppercase tracking-[0.14em] text-black/70 sm:text-xs">

                                <span className="text-accent"> ({userRole?.toUpperCase()})</span>
                            </div>

                                type="button"
                                onClick={onLogout}

                            >
                                Sign Out
                            </button>
                        </div>
                    </div>

                        className="mx-auto max-w-[1600px] space-y-6 p-5 sm:p-6 lg:p-8"
                        initial="hidden"
                        animate="visible"
                        variants={{ hidden: {}, visible: { transition: { staggerChildren: 0.06 } } }}
                    >
                        {/* SUB TAB NAVIGATION BAR */}

                            <button
                                type="button"
                                onClick={() => setActiveSubTab("dossiers")}
                                className={`pb-3 text-[10px] font-semibold uppercase tracking-[0.14em] transition-all border-b-2 sm:text-xs ${
                                    activeSubTab === "dossiers"
                                        ? "border-accent text-black"
                                        : "border-transparent text-black/50 hover:text-black"
                                }`}
                            >
                                Case Dossiers
                            </button>
                            <button
                                type="button"
                                onClick={() => setActiveSubTab("requests")}

                                    activeSubTab === "requests"
                                        ? "border-accent text-black"
                                        : "border-transparent text-black/50 hover:text-black"
                                }`}

                                Access Requests
                                {pendingCount > 0 && (
                                    <span className="ml-2 animate-pulse rounded-full border-2 border-black bg-accent px-2 py-0.5 text-[10px] font-bold text-white">
                                        {pendingCount}
                                    </span>
                                )}

                                <input 
                                    type="text" 
                                    placeholder="Search dossier records..." 
                                    value={searchQuery}

                                    className={`${ThemisNomos_INPUT} pl-10 py-2.5 text-xs`}
                                />
                                <span className="absolute left-3 top-3 text-accent text-sm">+</span>
                            </div>
                            
                            <div className="flex w-full flex-wrap items-center gap-3 md:w-auto">
                                <select 
                                    value={statusFilter} 
                                    onChange={(e) => handleFilterChange("status", e.target.value)}
                                    className={`${ThemisNomos_INPUT} w-auto py-2.5 text-[10px] uppercase tracking-[0.1em]`}
                                >
                                    <option value="All">Status: All</option>
                                    <option value="Pending Review">Pending Review</option>
                                    <option value="Recommended">Recommended</option>
                                    <option value="Assigned">Assigned</option>
                                    <option value="Active">Active</option>
                                    <option value="Solved">Solved</option>
                                    <option value="Closed">Closed</option>
                                    <option value="Rejected">Rejected</option>
                                </select>

                                <select 
                                    value={typeFilter} 
                                    onChange={(e) => handleFilterChange("type", e.target.value)}
                                    className={`${ThemisNomos_INPUT} w-auto py-2.5 text-[10px] uppercase tracking-[0.1em]`}
                                >
                                    <option value="All">Classification: All</option>
                                    <option value="Cyber Fraud">Cyber Fraud</option>
                                    <option value="Theft">Theft</option>
                                    <option value="Assault">Assault</option>
                                    <option value="Fraud">Financial Fraud</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </motion.div>

                        {error && (
                            <div className="flex items-center gap-2 rounded-xl border-2 border-red-600/40 bg-red-50 px-4 py-3 text-xs font-semibold text-red-700">
                                <Icon name="AlertTriangle" size={14} />
                                <span>{error}</span>
                            </div>
                        )}

                        {/* CASE DOSSIER GRID */}
                        {loading ? (
                            <div className={`${ThemisNomos_CARD} flex h-96 w-full flex-col items-center justify-center space-y-3`}>
                                <div className="h-6 w-6 animate-spin rounded-full border-2 border-accent border-t-transparent" />
                                <p className="text-xs font-semibold uppercase tracking-[0.16em] text-black/60">Querying central database...</p>
                            </div>
                        ) : cases.length === 0 ? (
                            <div className={`${ThemisNomos_CARD} flex h-96 w-full flex-col items-center justify-center space-y-2 border-dashed`}>
                                <p className="text-sm font-semibold uppercase tracking-[0.12em] text-black">No dossiers found</p>
                                <p className="text-xs font-semibold uppercase tracking-[0.1em] text-black/55">No entries match your current filters.</p>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                                    {cases.map((c) => {
                                        const statusColors = {
                                            Active: "bg-amber-100 text-amber-900 border-amber-400",
                                            Solved: "bg-emerald-100 text-emerald-900 border-emerald-500",
                                            Closed: "bg-black/5 text-black/60 border-black/20",
                                            "Pending Review": "bg-blue-100 text-blue-900 border-blue-400",
                                            Recommended: "bg-purple-100 text-purple-900 border-purple-400",
                                            Assigned: "bg-indigo-100 text-indigo-900 border-indigo-400",
                                            Rejected: "bg-red-100 text-red-900 border-red-400"
                                        };
                                        return (
                                            <div 
                                                key={c.case_id} 
                                                onClick={() => setSelectedCase(c)}
                                                className={`${ThemisNomos_CARD} group relative flex cursor-pointer flex-col justify-between p-5 transition-all hover:shadow-xl`}
                                            >
                                                <div>
                                                    <div className="mb-3 flex items-center justify-between">
                                                        <span className="text-[11px] font-semibold uppercase tracking-[0.14em] text-black/60 transition-colors group-hover:text-accent">
                                                            {c.display_id || `BLR-${String(c.case_id).padStart(3, '0')}`}
                                                        </span>
                                                        <span className={`rounded-full border-2 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-[0.1em] ${statusColors[c.status] || statusColors.Active}`}>
                                                            {c.status}
                                                        </span>
                                                    </div>
                                                    <h3 className="mb-1 line-clamp-1 text-[15px] font-semibold text-black group-hover:text-accent">
                                                        {c.title}
                                                    </h3>
                                                    <p className="mb-4 line-clamp-2 text-xs font-medium leading-relaxed text-black/65">
                                                        {c.description || "No file logs details provided."}
                                                    </p>
                                                </div>
                                                
                                                <div className="mt-2 flex items-center justify-between border-t-2 border-black/10 pt-3 text-[11px] font-semibold uppercase tracking-[0.1em] text-black/55">
                                                    <div><span className="text-accent">+</span> {c.crime_type}</div>
                                                    <div className="flex items-center gap-1">
                                                        <Icon name="MapPin" size={12} className="text-accent" />
                                                        {c.location || "N/A"}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* INDUSTRIAL PAGINATION BAR */}
                                <div className={`${ThemisNomos_CARD} flex flex-wrap items-center justify-between gap-3 px-6 py-4 text-xs`}>
                                    <div className="font-semibold uppercase tracking-[0.1em] text-black/65">
                                        Showing <span className="text-black">{cases.length}</span> of <span className="text-black">{totalRecords}</span> entries
                                    </div>
                                    
                                    <div className="flex items-center gap-2">
                                        <button 
                                            type="button"
                                            disabled={currentPage === 1}
                                            onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                                            className="rounded-full border-2 border-black bg-white/80 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-black transition-all hover:bg-black hover:text-white disabled:cursor-not-allowed disabled:opacity-40"
                                        >
                                            Prev
                                        </button>
                                        
                                        <div className="select-none rounded-full border-2 border-black/20 bg-white/60 px-4 py-1.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-black/70">
                                            Page <span className="text-accent">{currentPage}</span> / {totalPages}
                                        </div>

                                        <button 
                                            type="button"
                                            disabled={currentPage === totalPages}
                                            onClick={() => setCurrentPage(p => Math.min(totalPages, p + 1))}
                                            className="rounded-full border-2 border-black bg-white/80 px-3 py-1.5 text-[10px] font-semibold uppercase tracking-[0.1em] text-black transition-all hover:bg-black hover:text-white disabled:cursor-not-allowed disabled:opacity-40"
                                        >
                                            Next
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                            </>
                        )}

                        {activeSubTab === "requests" && (
                            <div className="space-y-4">
                                {requestActionMessage && (
                                    <div className="rounded-xl border-2 border-emerald-500/40 bg-emerald-50 px-4 py-3 text-xs font-semibold text-emerald-800">
                                        {requestActionMessage}
                                    </div>
                                )}
                                {requestsError && (
                                    <div className="flex items-center gap-2 rounded-xl border-2 border-red-600/40 bg-red-50 px-4 py-3 text-xs font-semibold text-red-700">
                                        <Icon name="AlertTriangle" size={14} />
                                        <span>{requestsError}</span>
                                    </div>
                                )}
                                {requestsLoading ? (
                                    <div className={`${ThemisNomos_CARD} flex h-96 w-full flex-col items-center justify-center space-y-3`}>
                                        <div className="h-6 w-6 animate-spin rounded-full border-2 border-accent border-t-transparent" />
                                        <p className="text-xs font-semibold uppercase tracking-[0.16em] text-black/60">Syncing access requests...</p>
                                    </div>
                                ) : requests.length === 0 ? (
                                    <div className={`${ThemisNomos_CARD} flex h-64 w-full flex-col items-center justify-center space-y-2 border-dashed`}>
                                        <p className="text-sm font-semibold uppercase tracking-[0.12em] text-black">No access requests</p>
                                        <p className="text-xs font-semibold uppercase tracking-[0.1em] text-black/55">Citizen requests for your cases will appear here.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {requests.map((req) => (
                                            <div key={req.request_id} className={ThemisNomos_CARD}>
                                                <div className="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
                                                    <div className="flex-1 space-y-2">
                                                        <div className="flex flex-wrap items-center gap-3">
                                                            <span className="text-[11px] font-semibold uppercase tracking-[0.14em] text-accent">
                                                                {req.case_id_display || `BLR-${String(req.case_id).padStart(3, "0")}`}
                                                            </span>
                                                            {requestStatusBadge(req.status)}
                                                        </div>
                                                        <h3 className="text-base font-semibold text-black">
                                                            {req.case_title || "Case dossier access request"}
                                                        </h3>

                                                            <span className="font-semibold uppercase tracking-[0.08em] text-black/50">Requester:</span>{" "}
                                                            {req.requester_name} · {req.requester_email} · {req.requester_number}

                                                            {req.reason}

                                                                type="button"
                                                                onClick={() => handleDecide(req.request_id, "reject")}

                                                        const kb = (item.file_size / 1024).toFixed(1);

                                                        const secureUrl = `${API_BASE}/cases/evidence/file/${item.case_id}/${item.file_name}?X-Officer-Id=${officer?.officer_id}&X-Session-Token=${sessionParam}`;
                                                        const downloadUrl = `${API_BASE}/cases/${item.case_id}/evidence/${item.file_name}/download?X-Officer-Id=${officer?.officer_id}&X-Session-Token=${sessionParam}`;
                                                        
                                                        return (
                                                            <div key={item.evidence_id} className="flex flex-col gap-2 rounded-lg border-2 border-black/10 bg-white p-3">
                                                                <div className="flex items-start justify-between">
                                                                    <div>

                                                                            <Icon name={isImage ? "Image" : isVideo ? "Video" : isAudio ? "Music" : "FileText"} size={12} />
                                                                            {item.original_name}

                                                                            Uploaded by: {item.officer_name} · {kb} KB · {new Date(item.created_at).toLocaleDateString()}

                                                                    <div className="flex items-center gap-1.5">
                                                                        <a

                                        {/* UPLOAD EVIDENCE FORM */}
