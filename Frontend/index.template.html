    <script>
        (function(){
            const isLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
            const devSiteKey = "6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"; // Google test site key (v2 Invisible)
            const prodSiteKey = "6Lf6HQEtAAAAAD8Ih_pq3csHR3vkYZnn74tkfgaX"; // Your site key (v2 Invisible)
            const params = new URLSearchParams(location.search);
            const querySiteKey = params.get("recaptcha_site_key");
            if (querySiteKey) localStorage.setItem("CRMS_RECAPTCHA_SITE_KEY", querySiteKey);
            const configuredSiteKey = window.CRMS_RECAPTCHA_SITE_KEY || localStorage.getItem("CRMS_RECAPTCHA_SITE_KEY");
            const siteKey = configuredSiteKey || (isLocalhost ? devSiteKey : prodSiteKey);
            console.log("[reCAPTCHA] Loading reCAPTCHA v2 (Invisible) with site key:", siteKey.substring(0, 10) + "...");
            window._recaptcha_site_key = siteKey;
            const s = document.createElement('script');
            s.src = 'https://www.google.com/recaptcha/api.js';
            s.async = true; s.defer = true;
            s.onload = () => console.log("[reCAPTCHA] v2 Script loaded successfully");
            s.onerror = () => console.error("[reCAPTCHA] Failed to load reCAPTCHA script");
            document.head.appendChild(s);
        })();
    </script>
